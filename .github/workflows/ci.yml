name: CI

# Deliberately not on push. Your own commits are covered by `bun run check`, which does
# the same work in under two seconds, and the release workflow runs all of this again
# before it publishes anything. What is left is the case that matters for an open source
# repo: code arriving from someone else, which nobody has run anything against yet.
on:
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.14'

jobs:
  check:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Lint and formatting
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build for this machine
        run: bun run build

  cross-compile:
    name: Build every target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # Catches a dependency that cannot cross compile long before a release does.
      - name: Cross compile all targets
        run: bun run build:all

      - uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/
          retention-days: 1

  # Building a binary is not the same as it working. A cross compiled binary can build
  # cleanly and then segfault on the machine it was built for, which is exactly what got
  # through to a published release once. These run the real artifacts on the real systems.
  run-binaries:
    name: Run it on ${{ matrix.os }}
    needs: cross-compile
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            binary: smartify-os-linux-x64
          - os: windows-latest
            binary: smartify-os-windows-x64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: binaries

      - name: Run it
        shell: bash
        run: |
          set -eu
          chmod +x "${{ matrix.binary }}"
          "./${{ matrix.binary }}" --version
          "./${{ matrix.binary }}" --help
          # A bunfig.toml or .env next to the user has nothing to do with us, and used to
          # stop the binary from starting at all.
          printf 'not valid toml [[[\n' > bunfig.toml
          printf 'SOMETHING=1\n' > .env
          "./${{ matrix.binary }}" --version
          # A reader that goes away early must not turn into an EPIPE stack trace.
          "./${{ matrix.binary }}" --help | head -2

  run-binary-musl:
    name: Run it on Alpine
    needs: cross-compile
    runs-on: ubuntu-latest
    container: alpine:latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: binaries

      - name: Run it
        run: |
          set -eu
          # Bun's musl binaries link against libstdc++, which Alpine does not ship.
          apk add --no-cache libstdc++
          chmod +x smartify-os-linux-x64-musl
          ./smartify-os-linux-x64-musl --version
          ./smartify-os-linux-x64-musl --help

  installers:
    name: Check the install scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Shellcheck install.sh
        run: shellcheck --shell=sh install.sh

      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./install.ps1),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Host $_ }
            exit 1
          }
          Write-Host 'install.ps1 parses cleanly'
